    .leaflet-control-layers {

    /* Info panel */
    .info-panel {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #0f3460;
      z-index: 1000;

      max-width: 90%;

    }

    .info-panel p { color: #ccc; font-size: 0.9rem; line-height: 1.5; }

    /* Legend */
    .legend {
      background: rgba(26, 26, 46, 0.95) !important;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      line-height: 1.8;
      color: #e0e0ff;
      font-size: 0.85rem;
    }
    .legend h4 { margin-bottom: 6px; color: #e94560; }
    .legend i {
      width: 16px;
      height: 16px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 2px;
    }

    /* Upload control */
    .upload-control {
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0ff;
      font-size: 0.85rem;
      max-width: 220px;
    }
    .upload-control h4 { margin-bottom: 8px; color: #e94560; }
    .upload-control input[type="file"] { display: none; }
    .upload-btn {
      display: inline-block;
      background: #e94560;
      color: #fff;
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
      border: none;
      margin-bottom: 6px;
    }
    .upload-btn:hover { background: #c73652; }
    .upload-status { color: #aab; font-size: 0.75rem; margin-top: 4px; }
    .clear-btn {
      display: none;
      background: #333;
      color: #ccc;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      border: 1px solid #555;
      margin-top: 4px;
    }
    .clear-btn:hover { background: #444; }

    /* Loading indicator — auto-hides via CSS */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 20px 30px;
      border-radius: 10px;
      border: 1px solid #e94560;
      z-index: 2000;
      font-size: 1.1rem;
      animation: fadeout 0.5s ease 1.5s forwards;
      pointer-events: none;
    }
    @keyframes fadeout {
      to { opacity: 0; visibility: hidden; }
    }

    /* MSA popup table */
    .msa-popup { font-size: 0.85rem; }
    .msa-popup td { padding: 2px 6px; }
    .msa-popup .label { color: #666; }

      zoom: 5,
      minZoom: 3,
      maxZoom: 18,
      zoomControl: true
    });

    // --- Base layers (all from arcgisonline.com) ---
    const darkBase = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri', maxZoom: 16
      }
    );
    const lightBase = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri', maxZoom: 16
      }
    );
    const satelliteBase = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri', maxZoom: 19
      }
    );
    const streetBase = L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
        attribution: '&copy; Esri', maxZoom: 19
      }
    );
    darkBase.addTo(map);

    // --- State boundaries (local GeoJSON) ---
    let statesLayer;
    fetch('lib/states-10m.json')
      .then(r => r.json())
      .then(us => {
        const geojson = topojson.feature(us, us.objects.states);
        statesLayer = L.geoJSON(geojson, {
          style: {
            fillColor: 'transparent', fillOpacity: 0,
            color: '#4a6fa5', weight: 1.5, opacity: 0.8
          },
          onEachFeature: (feature, layer) => {
            const info = stateData[feature.id];
            if (info) {
              layer.on({
                mouseover: e => {
                  e.target.setStyle({ color: '#e94560', weight: 2.5, fillColor: '#e94560', fillOpacity: 0.1 });
                },
                mouseout: e => { statesLayer.resetStyle(e.target); },
                click: e => {
                  const panel = document.getElementById('info-panel');
                  document.getElementById('info-name').textContent = `${info.name} (${info.abbr})`;
                  document.getElementById('info-detail').textContent =
                    `Capital: ${info.capital} | Population: ~${info.pop}`;
                  panel.style.display = 'block';
                  map.fitBounds(e.target.getBounds(), { padding: [50, 50] });
                }
              });
              layer.bindTooltip(info.name, { sticky: true });
            }
          }
        }).addTo(map);
        // Add to layer control now that it's loaded
        layerControl.addOverlay(statesLayer, 'State Borders');
      });

    // --- MSA Boundaries (Census Bureau TIGERweb) ---
    const msaLayer = L.esri.dynamicMapLayer({
      url: 'https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/tigerWMS_Current/MapServer',
      layers: [93],
      opacity: 0.6,
      transparent: true,
      useCors: true
    });

    // --- FEMA National Flood Hazard Layer ---
    const femaFloodLayer = L.esri.dynamicMapLayer({
      url: 'https://hazards.fema.gov/arcgis/rest/services/public/NFHL/MapServer',
      layers: [28],
      opacity: 0.5,
      transparent: true,
      useCors: false  // FEMA doesn't support CORS — use JSONP fallback
    });

    // Log FEMA errors for debugging
    femaFloodLayer.on('requesterror', function(e) {
      console.warn('FEMA layer request error:', e);
    });

    // --- Loan data layer (populated by file upload) ---
    let loanLayer = L.layerGroup().addTo(map);

    // --- Layer control ---
    const baseLayers = {
      'Dark': darkBase, 'Light': lightBase,
      'Street': streetBase, 'Satellite': satelliteBase
    };
    const overlays = {
      'MSA Boundaries': msaLayer,
      'FEMA Flood Zones (zoom in)': femaFloodLayer,
      'Loan Concentrations': loanLayer
    };
    const layerControl = L.control.layers(baseLayers, overlays, {
      collapsed: false,
      position: 'topright'
    }).addTo(map);

    // --- File upload control ---
    const uploadControl = L.control({ position: 'topleft' });
    uploadControl.onAdd = function () {
      const div = L.DomUtil.create('div', 'upload-control');
      div.innerHTML = `
        <h4>Loan Tape Upload</h4>
        <label class="upload-btn" for="file-input">Choose File</label>
        <input type="file" id="file-input" accept=".txt,.csv,.tsv,.pipe" />
        <div class="upload-status" id="upload-status">
          Supports Freddie Mac CRT pipe-delimited files, or CSV with MSA/zip + UPB columns
        </div>
        <button class="clear-btn" id="clear-btn" onclick="clearLoanData()">Clear Loan Data</button>
      `;
      L.DomEvent.disableClickPropagation(div);
      return div;
    };
    uploadControl.addTo(map);

    // --- Legend ---
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = function () {
      const div = L.DomUtil.create('div', 'legend');
      div.innerHTML = `
        <h4>Legend</h4>
        <div><i style="background:#4a6fa5;opacity:0.8"></i> State Borders</div>
        <div><i style="background:#00e5ff;opacity:0.5"></i> MSA Boundaries</div>
        <div><i style="background:#4264fb;opacity:0.5"></i> FEMA Flood Zones</div>
        <div><i style="background:#e94560;opacity:0.7;border-radius:50%"></i> Loan Concentrations</div>
        <div style="margin-top:6px;font-size:0.75rem;color:#999;">
          Zoom in for flood zone detail.<br>
          Upload a loan tape to see concentrations.
        </div>
      `;
      return div;
    };
    legend.addTo(map);

    // --- Loan tape parsing ---
    // Freddie Mac CRT Reference Pool Disclosure Layout (v3.7, 90 fields, pipe-delimited, NO header row)
    // Key field positions (0-indexed):
    //   0  = Period (CCYYMM)
    //   1  = Reference Pool Number
    //   2  = Loan Identifier
    //   3  = Amortization Type
    //   4  = Seller Name
    //   5  = Property State (2-letter)
    //   6  = Postal Code (3-digit ZIP)
    //   7  = MSA / Metropolitan Division (5-digit CBSA)
    //  12  = Original UPB
    //  13  = UPB at Issuance
    //  22  = Credit Score (FICO at origination)
    //  23  = Original LTV
    //  24  = Original CLTV
    //  25  = Original DTI
    //  39  = Current Actual UPB
    //  59  = Estimated LTV (quarterly)
    const FMC = { MSA: 7, ZIP: 6, STATE: 5, ORIG_UPB: 12, UPB_ISSUANCE: 13,
                  FICO: 22, OLTV: 23, OCLTV: 24, DTI: 25, CUR_UPB: 39, ELTV: 59 };

    document.getElementById('file-input').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      document.getElementById('upload-status').textContent = 'Reading file...';

      const reader = new FileReader();
      reader.onload = function(evt) {
        parseLoanTape(evt.target.result, file.name);
      };
      reader.readAsText(file);
    });

    function parseLoanTape(text, filename) {
      const lines = text.trim().split('\n');
      if (lines.length < 1) {
        document.getElementById('upload-status').textContent = 'Error: File appears empty';
        return;
      }

      // Detect delimiter
      const firstLine = lines[0];
      let delimiter = '|';
      if (!firstLine.includes('|')) {
        if (firstLine.includes('\t')) delimiter = '\t';
        else if (firstLine.includes(',')) delimiter = ',';
      }

      const firstCols = firstLine.split(delimiter);
      let fieldMap = null;
      let startRow = 0;

      // Detect if this is a headerless Freddie Mac CRT file (typically 80-90+ pipe fields)
      if (delimiter === '|' && firstCols.length >= 40) {
        // Check if first row looks like data (field 0 = CCYYMM period, field 7 = 5-digit MSA)
        const f0 = firstCols[0]?.trim();
        const f7 = firstCols[7]?.trim();
        const isFMCData = /^\d{6}$/.test(f0) && (/^\d{5}$/.test(f7) || f7 === '');

        if (isFMCData) {
          // Headerless Freddie Mac CRT format
          fieldMap = FMC;
          startRow = 0;
        } else {
          // Has a header row — check if it matches the disclosure-header.txt format
          const h = firstCols.map(c => c.trim().toUpperCase());
          if (h.includes('MSA') || h.some(x => x.includes('METROPOLITAN'))) {
            fieldMap = {
              MSA: h.findIndex(x => x === 'MSA' || x.includes('METROPOLITAN')),
              ZIP: h.findIndex(x => x === 'POSTAL CODE' || x.includes('POSTAL')),
              STATE: h.findIndex(x => x === 'PROPERTY STATE'),
              ORIG_UPB: h.findIndex(x => x === 'ORIGINAL UPB' || x.includes('ORIG') && x.includes('UPB')),
              UPB_ISSUANCE: h.findIndex(x => x === 'UPB AT ISSUANCE'),
              FICO: h.findIndex(x => x === 'CREDIT SCORE' || x === 'FICO'),
              OLTV: h.findIndex(x => x.includes('ORIGINAL') && x.includes('LTV') && !x.includes('COMBINED')),
              OCLTV: h.findIndex(x => x.includes('ORIGINAL') && x.includes('CLTV')),
              DTI: h.findIndex(x => x.includes('DTI') || x.includes('DEBT-TO-INCOME')),
              CUR_UPB: h.findIndex(x => x === 'CURRENT ACTUAL UPB' || (x.includes('CURRENT') && x.includes('UPB'))),
              ELTV: h.findIndex(x => x.includes('ESTIMATED') && x.includes('LTV'))
            };
            startRow = 1;
          }
        }
      }

      // Fallback: try generic CSV/TSV header detection
      if (!fieldMap) {
        const h = firstCols.map(c => c.trim().toUpperCase().replace(/"/g, ''));
        const msaIdx = h.findIndex(x =>
          x === 'MSA' || x === 'MSA_CODE' || x === 'CBSA' || x === 'MSA_CD' || x.includes('METROPOLITAN')
        );
        if (msaIdx !== -1) {
          fieldMap = {
            MSA: msaIdx,
            ZIP: h.findIndex(x => /^(ZIP|POSTAL|ZIP_CODE|ZIP_3)/.test(x)),
            STATE: h.findIndex(x => x === 'STATE' || x === 'PROPERTY_STATE' || x === 'PROPERTY STATE'),
            ORIG_UPB: h.findIndex(x => /UPB|LOAN.?AMOUNT|ORIG.?AMT/.test(x)),
            FICO: h.findIndex(x => /FICO|CREDIT.?SCORE/.test(x)),
            OLTV: h.findIndex(x => /^O?LTV$|ORIGINAL.*LTV/.test(x)),
            DTI: h.findIndex(x => /DTI|DEBT/.test(x)),
            CUR_UPB: -1, UPB_ISSUANCE: -1, OCLTV: -1, ELTV: -1
          };
          startRow = 1;
        } else {
          document.getElementById('upload-status').textContent =
            'Could not detect format. Expected Freddie Mac CRT pipe-delimited file or CSV with MSA column.';
          return;
        }
      }

      // Aggregate by MSA
      const msaAgg = {};
      let totalLoans = 0;
      let totalUPB = 0;

      for (let i = startRow; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const cols = line.split(delimiter);

        const msa = (cols[fieldMap.MSA] || '').trim();
        if (!msa || msa.length < 4 || /^0+$/.test(msa)) continue;

        const origUPB = fieldMap.ORIG_UPB >= 0 ? parseFloat(cols[fieldMap.ORIG_UPB]) || 0 : 0;
        const curUPB = fieldMap.CUR_UPB >= 0 ? parseFloat(cols[fieldMap.CUR_UPB]) || 0 : 0;
        const fico = fieldMap.FICO >= 0 ? parseInt(cols[fieldMap.FICO]) || 0 : 0;
        const oltv = fieldMap.OLTV >= 0 ? parseInt(cols[fieldMap.OLTV]) || 0 : 0;
        const dti = fieldMap.DTI >= 0 ? parseInt(cols[fieldMap.DTI]) || 0 : 0;
        const zip = fieldMap.ZIP >= 0 ? (cols[fieldMap.ZIP] || '').trim() : '';
        const state = fieldMap.STATE >= 0 ? (cols[fieldMap.STATE] || '').trim() : '';

        if (!msaAgg[msa]) {
          msaAgg[msa] = {
            count: 0, totalOrigUPB: 0, totalCurUPB: 0,
            ficos: [], ltvs: [], dtis: [],
            zips: new Set(), states: new Set()
          };
        }
        const agg = msaAgg[msa];
        agg.count++;
        agg.totalOrigUPB += origUPB;
        agg.totalCurUPB += curUPB;
        if (fico > 300 && fico < 900) agg.ficos.push(fico);
        if (oltv > 0 && oltv <= 200) agg.ltvs.push(oltv);
        if (dti > 0 && dti <= 100) agg.dtis.push(dti);
        if (zip) agg.zips.add(zip);
        if (state) agg.states.add(state);
        totalLoans++;
        totalUPB += origUPB;
      }

      displayLoanData(msaAgg, totalLoans, totalUPB);
    }

    function avg(arr) {
      return arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
    }

    function displayLoanData(msaAgg, totalLoans, totalUPB) {
      loanLayer.clearLayers();

      const msaCodes = Object.keys(msaAgg);
      if (msaCodes.length === 0) {
        document.getElementById('upload-status').textContent = 'No MSA data found in file';
        return;
      }

      const maxCount = Math.max(...msaCodes.map(m => msaAgg[m].count));
      let mapped = 0;

      msaCodes.forEach(msa => {
        const centroid = msaCentroids[msa];
        if (!centroid) return;

        mapped++;
        const d = msaAgg[msa];
        const pct = ((d.count / totalLoans) * 100).toFixed(2);
        const radius = Math.max(8, Math.min(50, (d.count / maxCount) * 50));

        const circle = L.circleMarker([centroid[0], centroid[1]], {
          radius: radius,
          fillColor: getHeatColor(d.count / maxCount),
          color: '#fff',
          weight: 1,
          fillOpacity: 0.75
        });

        const origStr = d.totalOrigUPB > 0 ? `$${(d.totalOrigUPB / 1e6).toFixed(1)}M` : 'N/A';
        const curStr = d.totalCurUPB > 0 ? `$${(d.totalCurUPB / 1e6).toFixed(1)}M` : 'N/A';
        const avgFico = avg(d.ficos);
        const avgLTV = avg(d.ltvs);
        const avgDTI = avg(d.dtis);

        circle.bindPopup(`
          <div class="msa-popup">
            <b>${centroid[2] || 'MSA ' + msa}</b><br>
            <table>
              <tr><td class="label">MSA Code:</td><td>${msa}</td></tr>
              <tr><td class="label">Loans:</td><td>${d.count.toLocaleString()}</td></tr>
              <tr><td class="label">% of Pool:</td><td>${pct}%</td></tr>
              <tr><td class="label">Orig UPB:</td><td>${origStr}</td></tr>
              ${d.totalCurUPB > 0 ? `<tr><td class="label">Cur UPB:</td><td>${curStr}</td></tr>` : ''}
              ${avgFico > 0 ? `<tr><td class="label">Avg FICO:</td><td>${avgFico.toFixed(0)}</td></tr>` : ''}
              ${avgLTV > 0 ? `<tr><td class="label">Avg LTV:</td><td>${avgLTV.toFixed(1)}%</td></tr>` : ''}
              ${avgDTI > 0 ? `<tr><td class="label">Avg DTI:</td><td>${avgDTI.toFixed(1)}%</td></tr>` : ''}
              <tr><td class="label">3-Digit Zips:</td><td>${d.zips.size}</td></tr>
              ${d.states.size > 0 ? `<tr><td class="label">States:</td><td>${[...d.states].join(', ')}</td></tr>` : ''}
            </table>
          </div>
        `);

        circle.bindTooltip(`${centroid[2] || msa}: ${d.count.toLocaleString()} loans (${pct}%)`, {
          sticky: true
        });

        loanLayer.addLayer(circle);
      });

      const unmapped = msaCodes.length - mapped;
      document.getElementById('upload-status').textContent =
        `${totalLoans.toLocaleString()} loans | ${msaCodes.length} MSAs` +
        (totalUPB > 0 ? ` | $${(totalUPB / 1e9).toFixed(2)}B UPB` : '') +
        (unmapped > 0 ? ` | ${unmapped} unmapped` : '');
      document.getElementById('clear-btn').style.display = 'inline-block';
    }

    function getHeatColor(ratio) {
      // Blue -> Yellow -> Red gradient
      if (ratio < 0.25) return '#3388ff';
      if (ratio < 0.50) return '#66bb6a';
      if (ratio < 0.75) return '#ffca28';
      return '#e94560';
    }

    function clearLoanData() {
      loanLayer.clearLayers();
      document.getElementById('upload-status').textContent =
        'Supports Freddie Mac CRT pipe-delimited files, or CSV with MSA/zip + UPB columns';
      document.getElementById('clear-btn').style.display = 'none';
      document.getElementById('file-input').value = '';
    }

    // --- Close info panel on map click ---
    map.on('click', () => {
      document.getElementById('info-panel').style.display = 'none';
    });

    // --- Hide loading indicator ---
    // Hide as soon as any tiles load, or after 2s max
    darkBase.on('tileload', function onFirst() {
      document.getElementById('loading').style.display = 'none';
      darkBase.off('tileload', onFirst);
    });
    darkBase.on('tileerror', function onErr() {
      document.getElementById('loading').style.display = 'none';
      darkBase.off('tileerror', onErr);
    });
    setTimeout(() => {
      document.getElementById('loading').style.display = 'none';
    }, 2000);
  </script>
</body>
</html>
