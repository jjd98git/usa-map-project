<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive USA Map — MSAs, FEMA Flood Zones &amp; Loan Data</title>

  <!-- Leaflet (bundled locally) -->
  <link rel="stylesheet" href="lib/leaflet.css" />
  <script src="lib/leaflet.js"></script>

  <!-- Esri Leaflet (bundled locally) -->
  <script src="lib/esri-leaflet.js"></script>

  <!-- TopoJSON client (bundled locally) -->
  <script src="lib/topojson-client.min.js"></script>

  <!-- ERCF Calculator, ZIP3 Geo, FHFA HPI (bundled locally) -->
  <script src="lib/ercf.js?v=2"></script>
  <script src="lib/zip3-geo.js?v=2"></script>
  <script src="lib/fhfa-hpi.js?v=1"></script>

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #fff;
    }
    #map { width: 100%; height: 100vh; }

    /* Layer control styling */
    .leaflet-control-layers {
      background: rgba(26, 26, 46, 0.95) !important;
      border: 1px solid #0f3460 !important;
      border-radius: 8px !important;
      color: #e0e0ff !important;
      padding: 8px 12px !important;
    }
    .leaflet-control-layers-selector { margin-right: 6px; }
    .leaflet-control-layers label { color: #e0e0ff; margin-bottom: 4px; display: block; }
    .leaflet-control-layers-separator { border-top-color: #0f3460 !important; }

    /* Info panel */
    .info-panel {
      position: fixed;
      bottom: 320px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 12px 24px;
      border-radius: 10px;
      border: 1px solid #0f3460;
      z-index: 1000;
      text-align: center;
      max-width: 90%;
      display: none;
    }
    .info-panel h3 { color: #e94560; margin-bottom: 4px; }
    .info-panel p { color: #ccc; font-size: 0.9rem; line-height: 1.5; }

    /* Legend */
    .legend {
      background: rgba(26, 26, 46, 0.95) !important;
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      line-height: 1.8;
      color: #e0e0ff;
      font-size: 0.85rem;
    }
    .legend h4 { margin-bottom: 6px; color: #e94560; }
    .legend i {
      width: 16px;
      height: 16px;
      display: inline-block;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 2px;
    }

    /* Upload control + flood control shared */
    .upload-control, .flood-control {
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0ff;
      font-size: 0.85rem;
      max-width: 260px;
    }
    .flood-control { margin-top: 8px; }
    .flood-control h4 { margin-bottom: 8px; color: #e94560; }
    .flood-control select {
      width: 100%;
      background: #0f3460;
      color: #e0e0ff;
      border: 1px solid #4a6fa5;
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 0.8rem;
    }
    .flood-control select option { background: #0f3460; }
    .flood-status { color: #aab; font-size: 0.75rem; margin-top: 6px; }
    .upload-control {
      max-width: 260px;
    }
    .upload-control h4 { margin-bottom: 8px; color: #e94560; }
    .upload-control input[type="file"] { display: none; }
    .upload-btn {
      display: inline-block;
      color: #fff;
      padding: 5px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.78rem;
      border: none;
      margin-bottom: 4px;
    }
    .upload-btn:hover { filter: brightness(0.85); }
    .upload-btn.freddie { background: #1565c0; }
    .upload-btn.fannie { background: #00897b; }
    .upload-status { color: #aab; font-size: 0.72rem; margin-top: 4px; line-height: 1.4; }
    .clear-btn {
      display: none;
      background: #333;
      color: #ccc;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
      border: 1px solid #555;
      margin-top: 4px;
    }
    .clear-btn:hover { background: #444; }
    .upload-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }
    .file-tag {
      display: inline-block;
      padding: 1px 7px;
      border-radius: 3px;
      font-size: 0.65rem;
      font-weight: 600;
      margin-right: 4px;
    }
    .file-tag.freddie { background: #1565c0; color: #fff; }
    .file-tag.fannie { background: #00897b; color: #fff; }

    /* HPA Slider Control */
    .hpa-slider-control {
      background: rgba(26, 26, 46, 0.95);
      border: 1px solid #0f3460;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e0ff;
      font-size: 0.85rem;
      min-width: 220px;
    }
    .hpa-slider-control h4 { margin-bottom: 6px; color: #e94560; font-size: 0.85rem; }
    .hpa-slider-control .year-display {
      text-align: center; font-size: 1.4rem; font-weight: 700;
      color: #fff; margin: 4px 0;
    }
    .hpa-slider-control input[type="range"] {
      width: 100%; cursor: pointer;
      accent-color: #e94560;
    }
    .hpa-slider-control .year-range {
      display: flex; justify-content: space-between;
      font-size: 0.65rem; color: #667;
    }
    .hpa-slider-control .play-btn {
      display: block; width: 100%; margin-top: 6px;
      background: #0f3460; color: #e0e0ff; border: 1px solid #4a6fa5;
      border-radius: 4px; padding: 4px 8px; cursor: pointer;
      font-size: 0.75rem; text-align: center;
    }
    .hpa-slider-control .play-btn:hover { background: #1a4a80; }
    .hpa-national-avg {
      margin-top: 6px; padding-top: 6px; border-top: 1px solid #0f3460;
      font-size: 0.72rem; color: #aab;
    }

    /* Loading indicator */
    #loading {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 20px 30px;
      border-radius: 10px;
      border: 1px solid #e94560;
      z-index: 2000;
      font-size: 1.1rem;
      animation: fadeout 0.5s ease 1.5s forwards;
      pointer-events: none;
    }
    @keyframes fadeout {
      to { opacity: 0; visibility: hidden; }
    }

    /* MSA popup table */
    .msa-popup { font-size: 0.85rem; }
    .msa-popup td { padding: 2px 6px; }
    .msa-popup .label { color: #666; }

    /* ====== DASHBOARD PANEL ====== */
    .dashboard {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(16, 24, 48, 0.97);
      border-top: 2px solid #e94560;
      z-index: 1100;
      font-size: 0.82rem;
      transition: height 0.3s ease;
      display: flex;
      flex-direction: column;
      backdrop-filter: blur(8px);
    }
    .dashboard.collapsed { height: 38px; overflow: hidden; }
    .dashboard.expanded { height: 300px; }
    .dashboard-header {
      display: flex;
      align-items: center;
      padding: 7px 16px;
      border-bottom: 1px solid #0f3460;
      cursor: pointer;
      min-height: 38px;
      flex-shrink: 0;
      user-select: none;
    }
    .dashboard-header h4 {
      color: #e94560;
      margin-right: 20px;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .dashboard-tabs {
      display: flex;
      gap: 2px;
    }
    .dashboard-tab {
      padding: 4px 14px;
      background: transparent;
      border: 1px solid #0f3460;
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: #778;
      cursor: pointer;
      font-size: 0.78rem;
      font-family: inherit;
    }
    .dashboard-tab.active {
      background: #0f3460;
      color: #e0e0ff;
    }
    .dashboard-toggle {
      margin-left: auto;
      background: none;
      border: none;
      color: #e94560;
      cursor: pointer;
      font-size: 1.2rem;
      font-family: monospace;
      padding: 0 4px;
    }
    .dashboard-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
    }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Overview tab */
    .overview-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
    }
    .overview-card {
      background: rgba(15, 52, 96, 0.4);
      border: 1px solid #0f3460;
      border-radius: 6px;
      padding: 10px 14px;
    }
    .overview-card h5 {
      color: #e94560;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }
    .overview-card .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
      color: #bbc;
      font-size: 0.78rem;
    }
    .overview-card .stat-row .val {
      color: #e0e0ff;
      font-weight: 600;
    }

    /* Delinquency tab */
    .dlq-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
      margin-bottom: 10px;
    }
    .dlq-table th, .dlq-table td {
      padding: 5px 12px;
      text-align: right;
      border-bottom: 1px solid #1a2a4a;
    }
    .dlq-table th {
      color: #e94560;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
    }
    .dlq-table th:first-child, .dlq-table td:first-child {
      text-align: left;
    }
    .dlq-table tr:hover { background: rgba(15, 52, 96, 0.3); }
    .dlq-positive { color: #4caf50; }
    .dlq-negative { color: #ef5350; }
    .dlq-neutral { color: #778; }

    .heatmap-controls {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .heatmap-controls label {
      color: #aab;
      cursor: pointer;
      font-size: 0.78rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .heatmap-controls input[type="radio"] { accent-color: #e94560; }
    .heatmap-legend {
      display: flex;
      gap: 3px;
      align-items: center;
      margin-left: 16px;
      font-size: 0.7rem;
      color: #778;
    }
    .heatmap-legend .swatch {
      width: 14px;
      height: 10px;
      border-radius: 1px;
    }

    /* HPA tab */
    .hpa-controls {
      display: flex;
      gap: 12px;
      margin-bottom: 10px;
      align-items: center;
    }
    .hpa-controls select {
      background: #0f3460;
      color: #e0e0ff;
      border: 1px solid #4a6fa5;
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 0.78rem;
      font-family: inherit;
    }
    .hpa-chart-area {
      display: flex;
      gap: 20px;
    }
    .hpa-bars {
      flex: 1;
      max-width: 500px;
    }
    .hpa-row {
      display: flex;
      align-items: center;
      margin-bottom: 3px;
      height: 20px;
    }
    .hpa-year {
      width: 36px;
      color: #aab;
      font-size: 0.72rem;
      flex-shrink: 0;
    }
    .hpa-bar-track {
      flex: 1;
      height: 14px;
      background: #1a2a4a;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }
    .hpa-bar {
      height: 100%;
      border-radius: 2px;
      transition: width 0.4s ease;
      position: absolute;
      top: 0;
    }
    .hpa-bar.positive { background: #4caf50; left: 50%; }
    .hpa-bar.negative { background: #ef5350; right: 50%; }
    .hpa-bar-center {
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #445;
    }
    .hpa-value {
      width: 56px;
      text-align: right;
      color: #e0e0ff;
      font-size: 0.72rem;
      flex-shrink: 0;
      margin-left: 6px;
    }
    .hpa-summary {
      min-width: 200px;
    }
    .hpa-summary .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 3px 0;
      color: #bbc;
      font-size: 0.75rem;
      border-bottom: 1px solid #1a2a4a;
    }
    .hpa-summary .stat-row .val {
      color: #e0e0ff;
      font-weight: 600;
    }
    .hpa-note {
      color: #667;
      font-size: 0.7rem;
      margin-top: 8px;
      font-style: italic;
    }
  </style>
</head>

                mouseover: e => {
                  if (heatMapMode === 'off') {
                    e.target.setStyle({ color: '#e94560', weight: 2.5, fillColor: '#e94560', fillOpacity: 0.1 });

                    e.target.setStyle({ weight: 3, color: '#fff' });

                mouseout: e => {

    async function loadFloodEvent(event) {
      const statusEl = document.getElementById('flood-status');
      statusEl.textContent = 'Loading FEMA data...';
      floodLayer.clearLayers();
      try {
        let records = [];
        for (const dn of event.disasters) {
          const url = 'https://www.fema.gov/api/open/v2/DisasterDeclarationsSummaries'
            + '?%24filter=disasterNumber%20eq%20' + dn
            + '&%24select=disasterNumber,declarationTitle,state,designatedArea,fipsStateCode,fipsCountyCode,incidentBeginDate,incidentEndDate'
            + '&%24top=1000&%24format=json';
          const resp = await fetch(url);
          if (!resp.ok) { console.warn('FEMA API error for DR-' + dn, resp.status); continue; }
          const data = await resp.json();
          records = records.concat(data.DisasterDeclarationsSummaries || []);
        }
        if (records.length === 0) { statusEl.textContent = 'No FEMA data found.'; return; }
        const affectedFIPS = new Set();
        const counties = [];
        records.forEach(r => {
          const fips = r.fipsStateCode + r.fipsCountyCode;
          if (!affectedFIPS.has(fips)) {
            affectedFIPS.add(fips);
            counties.push({ fips, name: r.designatedArea, state: r.state });
          }
        });
        statusEl.textContent = `Loading county boundaries (${affectedFIPS.size} counties)...`;
        if (!countiesGeoData) {
          const geoResp = await fetch(COUNTIES_GEOJSON_URL);
          countiesGeoData = await geoResp.json();
        }
        const affectedFeatures = countiesGeoData.features.filter(f => affectedFIPS.has(f.id));
        if (affectedFeatures.length === 0) {
          statusEl.textContent = `${affectedFIPS.size} counties declared, but no matching boundaries found.`;
          return;
        }
        const geoLayer = L.geoJSON({ type: 'FeatureCollection', features: affectedFeatures }, {
          style: { fillColor: '#ff1744', fillOpacity: 0.35, color: '#ff1744', weight: 1.5, opacity: 0.8 },
          onEachFeature: (feature, layer) => {
            const info = counties.find(c => c.fips === feature.id);
            const name = info ? `${info.name}, ${info.state}` : `FIPS: ${feature.id}`;
            layer.bindTooltip(name, { sticky: true });
            layer.bindPopup(`<b>${name}</b><br>${records[0].declarationTitle}<br>` +
              `Incident: ${records[0].incidentBeginDate?.substring(0,10) || 'N/A'}`);
          }
        });
        floodLayer.addLayer(geoLayer);
        if (!map.hasLayer(floodLayer)) floodLayer.addTo(map);
        map.fitBounds(geoLayer.getBounds(), { padding: [30, 30] });
        const title = records[0].declarationTitle || event.label;
        const states = [...new Set(records.map(r => r.state))].join(', ');
        statusEl.textContent = `${title} — ${affectedFIPS.size} counties (${states})`;
      } catch (err) {
        console.error('Flood event load error:', err);
        statusEl.textContent = 'Error loading flood data. Check console.';
      }
    }

    // ================================================================
    //  FIELD MAPS (with delinquency)
    // ================================================================
    // Freddie Mac CRT Reference Pool (~90 fields, pipe-delimited, NO header)
    const FMC = {
      PERIOD: 0, POOL: 1, LOAN_ID: 2, AMORT_TYPE: 3, SELLER: 4,
      STATE: 5, ZIP: 6, MSA: 7,
      ORIG_TERM: 10, ORIG_RATE: 11, ORIG_UPB: 12, UPB_ISSUANCE: 13,
      PURPOSE: 14, CHANNEL: 15, PROP_TYPE: 16, NUM_UNITS: 17,
      OCC_STATUS: 18, FTHB: 20,
      FICO: 22, OLTV: 23, OCLTV: 24, DTI: 25, MI_PCT: 26,
      LOAN_AGE: 33, DLQ_STATUS: 34, CUR_UPB: 39, ELTV: 59, IO: -1
    };

    // Fannie Mae CAS/CIRT (~104 fields, pipe-delimited, NO header)
    const FNMA = {
      POOL: 0, LOAN_ID: 1, PERIOD: 2, CHANNEL: 3, SELLER: 4, SERVICER: 5,
      ORIG_RATE: 7, ORIG_UPB: 9, UPB_ISSUANCE: 10, CUR_UPB: 11,
      ORIG_TERM: 12, DLQ_STATUS: 14, LOAN_AGE: 15,
      OLTV: 19, OCLTV: 20, DTI: 22,
      FICO: 23, PURPOSE: 26, PROP_TYPE: 27, NUM_UNITS: 28,
      OCC_STATUS: 29, STATE: 30, MSA: 31, ZIP: 32, MI_PCT: 33,
      AMORT_TYPE: 34, IO: 36, ELTV: -1
    };

    // ================================================================
    //  FILE INPUT HANDLERS
    // ================================================================
    document.getElementById('file-freddie').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) { parseLoanTape(evt.target.result, file.name, 'freddie'); };

    document.getElementById('file-fannie').addEventListener('change', function(e) {

      const reader = new FileReader();
      reader.onload = function(evt) { parseLoanTape(evt.target.result, file.name, 'fannie'); };
      reader.readAsText(file);
    });

    // ================================================================
    //  PARSE LOAN TAPE
    // ================================================================
    function parseLoanTape(text, filename, sourceHint) {
      const lines = text.trim().split('\n');
      if (lines.length < 1) {
        document.getElementById('upload-status').textContent = 'Error: File appears empty';
        return;
      }

      const firstLine = lines[0];
      let delimiter = '|';
      if (!firstLine.includes('|')) {
        if (firstLine.includes('\t')) delimiter = '\t';
        else if (firstLine.includes(',')) delimiter = ',';
      }

      const firstCols = firstLine.split(delimiter);
      let fm = null;
      let startRow = 0;
      let source = 'unknown';

      // Use sourceHint (from which button was clicked) to pick format directly
      if (sourceHint === 'freddie' && delimiter === '|' && firstCols.length >= 40) {
        fm = FMC; startRow = 0; source = 'Freddie Mac CRT';
      } else if (sourceHint === 'fannie' && delimiter === '|' && firstCols.length >= 40) {
        fm = FNMA; startRow = 0; source = 'Fannie Mae CAS';
      }

      // Auto-detect if sourceHint didn't match a pipe-delimited format
      if (!fm && delimiter === '|' && firstCols.length >= 40) {
        const f0 = (firstCols[0] || '').trim();
        if (/^\d{6}$/.test(f0)) {
          fm = FMC; startRow = 0; source = 'Freddie Mac CRT';
        } else if (firstCols.length >= 80) {
          fm = FNMA; startRow = 0; source = 'Fannie Mae CAS';
        } else {
          const h = firstCols.map(c => c.trim().toUpperCase());
          if (h.includes('MSA') || h.some(x => x.includes('METROPOLITAN'))) {
            fm = buildHeaderFieldMap(h);
            startRow = 1;
            source = 'Header-detected';
          }
        }
      }

      // Fallback: generic CSV/TSV with header row
      if (!fm) {
        const h = firstCols.map(c => c.trim().toUpperCase().replace(/"/g, ''));
        const msaIdx = h.findIndex(x => x === 'MSA' || x === 'CBSA' || x.includes('METROPOLITAN'));
        if (msaIdx !== -1) {
          fm = buildHeaderFieldMap(h);
          startRow = 1;
          source = 'CSV';
        } else {
          document.getElementById('upload-status').textContent =
            'Could not detect format. Supports: Freddie Mac CRT, Fannie Mae CAS, or CSV with MSA column.';
          return;
        }
      }

      // Determine source for storage
      let storageKey = sourceHint;
      if (!storageKey || storageKey === 'auto') {
        storageKey = (source.includes('Freddie') || source.includes('FMC')) ? 'freddie' : 'fannie';
      }

      // Parse and aggregate
      const msaAgg = {}, zipAgg = {}, stateAgg = {};
      const hpaByState = {}; // state -> [{ origYear, hpa, upb }]
      let totalLoans = 0, totalUPB = 0, totalRWA = 0, totalCapital = 0;
      let dlqCounts = { current: 0, d30: 0, d60: 0, d90plus: 0, unknown: 0 };

      for (let i = startRow; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;
        const c = line.split(delimiter);

        const msa     = (c[fm.MSA] || '').trim();
        const zip     = fm.ZIP >= 0 ? (c[fm.ZIP] || '').trim() : '';
        const state   = fm.STATE >= 0 ? (c[fm.STATE] || '').trim() : '';
        const origUPB = fm.ORIG_UPB >= 0 ? parseFloat(c[fm.ORIG_UPB]) || 0 : 0;
        const curUPB  = fm.CUR_UPB >= 0 ? parseFloat(c[fm.CUR_UPB]) || 0 : 0;
        const fico    = fm.FICO >= 0 ? parseInt(c[fm.FICO]) || 0 : 0;
        const oltv    = fm.OLTV >= 0 ? parseInt(c[fm.OLTV]) || 0 : 0;
        const dti     = fm.DTI >= 0 ? parseInt(c[fm.DTI]) || 0 : 0;
        const purpose = fm.PURPOSE >= 0 ? (c[fm.PURPOSE] || '').trim() : '';
        const channel = fm.CHANNEL >= 0 ? (c[fm.CHANNEL] || '').trim() : '';
        const propType= fm.PROP_TYPE >= 0 ? (c[fm.PROP_TYPE] || '').trim() : '';
        const numUnits= fm.NUM_UNITS >= 0 ? (c[fm.NUM_UNITS] || '').trim() : '1';
        const occ     = fm.OCC_STATUS >= 0 ? (c[fm.OCC_STATUS] || '').trim() : '';
        const amort   = fm.AMORT_TYPE >= 0 ? (c[fm.AMORT_TYPE] || '').trim() : '';
        const origTerm= fm.ORIG_TERM >= 0 ? (c[fm.ORIG_TERM] || '').trim() : '360';
        const loanAge = fm.LOAN_AGE >= 0 ? (c[fm.LOAN_AGE] || '').trim() : '0';
        const miPct   = fm.MI_PCT >= 0 ? (c[fm.MI_PCT] || '').trim() : '0';
        const io      = fm.IO >= 0 ? (c[fm.IO] || '').trim() : '';
        const eltv    = fm.ELTV >= 0 ? parseInt(c[fm.ELTV]) || 0 : 0;

        // Delinquency status
        const dlqRaw  = fm.DLQ_STATUS >= 0 ? (c[fm.DLQ_STATUS] || '').trim() : '';
        const dlqNum  = parseDlq(dlqRaw);

        if (dlqNum === 0) dlqCounts.current++;
        else if (dlqNum === 1) dlqCounts.d30++;
        else if (dlqNum === 2) dlqCounts.d60++;
        else if (dlqNum >= 3) dlqCounts.d90plus++;
        else dlqCounts.unknown++;

        // ERCF
        const upbForCalc = curUPB > 0 ? curUPB : origUPB;
        const ercf = ERCF.calculate({
          fico, ltv: oltv, upb: upbForCalc, eltv,
          purpose, occ, propType, numUnits, channel, dti,
          amortType: amort, origTerm, loanAge, miPct, io
        });

        // Aggregate by MSA
        if (msa && msa.length >= 4 && !/^0+$/.test(msa)) {
          if (!msaAgg[msa]) {
            msaAgg[msa] = {
              count: 0, totalOrigUPB: 0, totalCurUPB: 0,
              totalRWA: 0, totalCapCET1: 0, totalCapTotal: 0,
              ficos: [], ltvs: [], dtis: [], riskWeights: [],
              zips: new Set(), states: new Set(),
              dlq: { current: 0, d30: 0, d60: 0, d90plus: 0 }
            };
          }
          const a = msaAgg[msa];
          a.count++; a.totalOrigUPB += origUPB; a.totalCurUPB += curUPB;
          a.totalRWA += ercf.rwa; a.totalCapCET1 += ercf.capitalCET1; a.totalCapTotal += ercf.capitalTotal;
          a.riskWeights.push(ercf.riskWeight);
          if (fico > 300 && fico < 900) a.ficos.push(fico);
          if (oltv > 0 && oltv <= 200) a.ltvs.push(oltv);
          if (dti > 0 && dti <= 100) a.dtis.push(dti);
          if (zip) a.zips.add(zip);
          if (state) a.states.add(state);
          if (dlqNum === 0) a.dlq.current++;
          else if (dlqNum === 1) a.dlq.d30++;
          else if (dlqNum === 2) a.dlq.d60++;
          else if (dlqNum >= 3) a.dlq.d90plus++;
        }

        // Aggregate by ZIP3
        if (zip && zip.length >= 3) {
          const z3 = zip.substring(0, 3);
          if (!zipAgg[z3]) zipAgg[z3] = { count: 0, totalUPB: 0, totalCap: 0, ficos: [], ltvs: [] };
          zipAgg[z3].count++; zipAgg[z3].totalUPB += origUPB; zipAgg[z3].totalCap += ercf.capitalCET1;
          if (fico > 300) zipAgg[z3].ficos.push(fico);
          if (oltv > 0) zipAgg[z3].ltvs.push(oltv);
        }

        // Aggregate by state (for heat map + HPA)
        if (state && state.length === 2) {
          if (!stateAgg[state]) {
            stateAgg[state] = {
              count: 0, totalUPB: 0, totalRWA: 0, totalCap: 0,
              ficos: [], ltvs: [],
              dlq: { current: 0, d30: 0, d60: 0, d90plus: 0, unknown: 0 }
            };
          }
          const sa = stateAgg[state];
          sa.count++; sa.totalUPB += origUPB; sa.totalRWA += ercf.rwa; sa.totalCap += ercf.capitalCET1;
          if (fico > 300 && fico < 900) sa.ficos.push(fico);
          if (oltv > 0 && oltv <= 200) sa.ltvs.push(oltv);
          if (dlqNum === 0) sa.dlq.current++;
          else if (dlqNum === 1) sa.dlq.d30++;
          else if (dlqNum === 2) sa.dlq.d60++;
          else if (dlqNum >= 3) sa.dlq.d90plus++;
          else sa.dlq.unknown++;

          // HPA by vintage (if ELTV and OLTV available)
          if (eltv > 0 && oltv > 0 && curUPB > 0 && origUPB > 0) {
            const origVal = origUPB / (oltv / 100);
            const curVal  = curUPB / (eltv / 100);
            const cumHPA  = (curVal - origVal) / origVal;
            const ageM    = parseInt(loanAge) || 1;
            // Compute origination year
            const periodStr = fm.PERIOD >= 0 ? (c[fm.PERIOD] || '').trim() : '';
            let origYear = 0;
            if (/^\d{6}$/.test(periodStr)) {
              const pY = parseInt(periodStr.substring(0, 4));
              const pM = parseInt(periodStr.substring(4, 6));
              const origMonths = (pY * 12 + pM) - ageM;
              origYear = Math.floor(origMonths / 12);
            }
            if (origYear >= 2000 && origYear <= 2030) {
              if (!hpaByState[state]) hpaByState[state] = {};
              if (!hpaByState[state][origYear]) hpaByState[state][origYear] = { totalOrigVal: 0, totalCurVal: 0, count: 0 };
              hpaByState[state][origYear].totalOrigVal += origVal;
              hpaByState[state][origYear].totalCurVal += curVal;
              hpaByState[state][origYear].count++;
            }
          }
        }

        totalLoans++; totalUPB += origUPB; totalRWA += ercf.rwa; totalCapital += ercf.capitalCET1;
      }

      // Build summary
      const summary = {
        source, filename, totalLoans, totalUPB, totalRWA, totalCapital, dlqCounts,
        avgRW: totalUPB > 0 ? totalRWA / totalUPB : 0,
        sdqRate: totalLoans > 0 ? ((dlqCounts.d90plus) / totalLoans * 100) : 0,
        dlq60Rate: totalLoans > 0 ? ((dlqCounts.d60 + dlqCounts.d90plus) / totalLoans * 100) : 0
      };

      // Compute HPA summary per state per vintage
      const hpa = {};
      Object.entries(hpaByState).forEach(([st, years]) => {
        hpa[st] = {};
        Object.entries(years).forEach(([yr, d]) => {
          const cumHPA = (d.totalCurVal - d.totalOrigVal) / d.totalOrigVal;
          hpa[st][yr] = { cumHPA: cumHPA * 100, count: d.count };
        });
      });

      // Store data
      const result = { msaAgg, zipAgg, stateAgg, summary, hpa };
      if (storageKey === 'freddie') {
        freddieData = result;
      } else {
        fannieData = result;
      }

      displayLoanData(storageKey, result);
      updateDashboard();
      updateHeatMap();

      document.getElementById('clear-btn').style.display = 'inline-block';
    }

    function buildHeaderFieldMap(h) {
      return {
        MSA: h.findIndex(x => x === 'MSA' || x.includes('METROPOLITAN')),
        ZIP: h.findIndex(x => x.includes('POSTAL') || x.includes('ZIP')),
        STATE: h.findIndex(x => x.includes('STATE')),
        ORIG_UPB: h.findIndex(x => x.includes('ORIGINAL') && x.includes('UPB')),
        FICO: h.findIndex(x => x.includes('CREDIT SCORE') || x.includes('FICO')),
        OLTV: h.findIndex(x => x.includes('ORIGINAL') && x.includes('LTV') && !x.includes('COMBINED')),
        OCLTV: h.findIndex(x => x.includes('COMBINED') && x.includes('LTV')),
        DTI: h.findIndex(x => x.includes('DTI') || x.includes('DEBT')),
        CUR_UPB: h.findIndex(x => x.includes('CURRENT') && x.includes('UPB')),
        PURPOSE: h.findIndex(x => x.includes('PURPOSE')),
        CHANNEL: h.findIndex(x => x.includes('CHANNEL')),
        PROP_TYPE: h.findIndex(x => x.includes('PROPERTY TYPE')),
        NUM_UNITS: h.findIndex(x => x.includes('UNITS')),
        OCC_STATUS: h.findIndex(x => x.includes('OCCUPANCY')),
        AMORT_TYPE: h.findIndex(x => x.includes('AMORT') || x.includes('PRODUCT')),
        ORIG_TERM: h.findIndex(x => x.includes('ORIGINAL') && x.includes('TERM')),
        LOAN_AGE: h.findIndex(x => x.includes('AGE')),
        MI_PCT: h.findIndex(x => x.includes('INSURANCE') && x.includes('PERCENT')),
        IO: h.findIndex(x => x.includes('INTEREST ONLY')),
        ELTV: h.findIndex(x => x.includes('ESTIMATED') && x.includes('LTV')),
        DLQ_STATUS: h.findIndex(x => /DELINQU|DLQ|DELQ/.test(x)),
        PERIOD: h.findIndex(x => x.includes('PERIOD') || x.includes('REPORT'))
      };
    }

    function parseDlq(raw) {
      if (!raw || raw === '' || raw === 'XX' || raw === 'X') return -1;
      if (/^RA?$/i.test(raw)) return 99; // REO
      const n = parseInt(raw);
      return isNaN(n) ? -1 : n;
    }

    // ================================================================
    //  DISPLAY LOAN DATA ON MAP
    // ================================================================
    function displayLoanData(sourceKey, data) {
      const { msaAgg, zipAgg, summary } = data;
      const loanLayer = sourceKey === 'freddie' ? freddieLoanLayer : fannieLoanLayer;
      const zipLayer  = sourceKey === 'freddie' ? freddieZipLayer : fannieZipLayer;
      const bubbleColor = sourceKey === 'freddie' ? '#1565c0' : '#00897b';
      const dotColor    = sourceKey === 'freddie' ? '#42a5f5' : '#4db6ac';

      loanLayer.clearLayers();
      zipLayer.clearLayers();

      const msaCodes = Object.keys(msaAgg);
      if (msaCodes.length === 0) {
        document.getElementById('upload-status').textContent = 'No MSA data found in file.';
        return;
      }

      const maxCount = Math.max(...msaCodes.map(m => msaAgg[m].count));
      let mapped = 0;

      // MSA bubble markers
      msaCodes.forEach(msa => {
        const centroid = msaCentroids[msa];
        if (!centroid) return;
        mapped++;
        const d = msaAgg[msa];
        const pct = ((d.count / summary.totalLoans) * 100).toFixed(2);
        const radius = Math.max(8, Math.min(50, (d.count / maxCount) * 50));
        const avgRW = avg(d.riskWeights);
        const sdqPct = d.count > 0 ? ((d.dlq.d90plus) / d.count * 100) : 0;

        const circle = L.circleMarker([centroid[0], centroid[1]], {
          radius, fillColor: getRWColor(avgRW), color: bubbleColor, weight: 2, fillOpacity: 0.7
        });

        const avgFico = avg(d.ficos), avgLTV = avg(d.ltvs), avgDTI = avg(d.dtis);
        circle.bindPopup(`
          <div class="msa-popup">
            <b style="color:${bubbleColor}">[${sourceKey === 'freddie' ? 'FRE' : 'FNM'}]</b> <b>${centroid[2] || 'MSA ' + msa}</b>
            <table>
              <tr><td class="label">MSA:</td><td>${msa}</td></tr>
              <tr><td class="label">Loans:</td><td>${d.count.toLocaleString()} (${pct}%)</td></tr>
              <tr><td class="label">Orig UPB:</td><td>${fmtM(d.totalOrigUPB)}</td></tr>
              <tr><td colspan="2" style="border-top:1px solid #ddd;padding-top:4px;font-weight:bold">ERCF Capital</td></tr>
              <tr><td class="label">RWA:</td><td>${fmtM(d.totalRWA)}</td></tr>
              <tr><td class="label">CET1 (4.5%):</td><td>${fmtK(d.totalCapCET1)}</td></tr>
              <tr><td class="label">Avg RW:</td><td>${(avgRW * 100).toFixed(1)}%</td></tr>
              <tr><td colspan="2" style="border-top:1px solid #ddd;padding-top:4px;font-weight:bold">Delinquency</td></tr>
              <tr><td class="label">Current:</td><td>${d.dlq.current.toLocaleString()}</td></tr>
              <tr><td class="label">30 Day:</td><td>${d.dlq.d30.toLocaleString()}</td></tr>
              <tr><td class="label">60 Day:</td><td>${d.dlq.d60.toLocaleString()}</td></tr>
              <tr><td class="label">90+ Day:</td><td>${d.dlq.d90plus.toLocaleString()}</td></tr>
              <tr><td class="label">SDQ Rate:</td><td style="color:${sdqPct > 3 ? '#ef5350' : sdqPct > 1 ? '#ffca28' : '#4caf50'}">${sdqPct.toFixed(2)}%</td></tr>
              <tr><td colspan="2" style="border-top:1px solid #ddd;padding-top:4px;font-weight:bold">Collateral</td></tr>
              ${avgFico > 0 ? `<tr><td class="label">Avg FICO:</td><td>${avgFico.toFixed(0)}</td></tr>` : ''}
              ${avgLTV > 0 ? `<tr><td class="label">Avg LTV:</td><td>${avgLTV.toFixed(1)}%</td></tr>` : ''}
              ${avgDTI > 0 ? `<tr><td class="label">Avg DTI:</td><td>${avgDTI.toFixed(1)}%</td></tr>` : ''}
            </table>
          </div>
        `);

        circle.bindTooltip(
          `[${sourceKey === 'freddie' ? 'FRE' : 'FNM'}] ${centroid[2] || msa}: ${d.count.toLocaleString()} | SDQ: ${sdqPct.toFixed(1)}% | RW: ${(avgRW*100).toFixed(0)}%`,
          { sticky: true }
        );
        loanLayer.addLayer(circle);
      });

      // ZIP3 dot markers
      const zipCodes = Object.keys(zipAgg);
      const maxZipCount = Math.max(...zipCodes.map(z => zipAgg[z].count));

      zipCodes.forEach(z3 => {
        const coords = ZIP3GEO.getCoords(z3);
        if (!coords) return;
        const zd = zipAgg[z3];
        const r = Math.max(3, Math.min(12, (zd.count / maxZipCount) * 12));
        const dot = L.circleMarker(coords, {
          radius: r, fillColor: dotColor, color: '#fff', weight: 0.5, fillOpacity: 0.5
        });
        dot.bindPopup(`
          <div class="msa-popup">
            <b>[${sourceKey === 'freddie' ? 'FRE' : 'FNM'}] ZIP3: ${z3}</b>
            <table>
              <tr><td class="label">Loans:</td><td>${zd.count.toLocaleString()}</td></tr>
              <tr><td class="label">UPB:</td><td>${fmtM(zd.totalUPB)}</td></tr>
              <tr><td class="label">RBC:</td><td>${fmtK(zd.totalCap)}</td></tr>
            </table>
          </div>
        `);
        dot.bindTooltip(`[${sourceKey === 'freddie' ? 'FRE' : 'FNM'}] ZIP ${z3}: ${zd.count} loans`, { sticky: true });
        zipLayer.addLayer(dot);
      });

      if (!map.hasLayer(zipLayer)) zipLayer.addTo(map);

      // Scale zip dots on zoom
      function scaleZipDots() {
        const zoom = map.getZoom();
        const scale = Math.pow(1.3, zoom - 5);
        zipLayer.eachLayer(function(layer) {
          if (layer._baseRadius === undefined) layer._baseRadius = layer.getRadius();
          layer.setRadius(layer._baseRadius * scale);
        });
      }
      map.off('zoomend.zip_' + sourceKey);
      map.on('zoomend.zip_' + sourceKey, scaleZipDots);

      // Update status
      const unmapped = msaCodes.length - mapped;
      const tag = sourceKey === 'freddie'
        ? '<span class="file-tag freddie">FRE</span>'
        : '<span class="file-tag fannie">FNM</span>';

      const loadedDiv = document.getElementById('loaded-files');
      const existingTag = loadedDiv.querySelector(`.file-info-${sourceKey}`);
      const info = `<div class="file-info-${sourceKey}" style="margin-top:4px;font-size:0.72rem;color:#bbc;">
        ${tag} ${summary.totalLoans.toLocaleString()} loans | ${fmtM(summary.totalUPB)} UPB | SDQ: ${summary.sdqRate.toFixed(2)}% | RW: ${(summary.avgRW*100).toFixed(1)}%
        ${unmapped > 0 ? ` | ${unmapped} unmapped MSAs` : ''}
      </div>`;
      if (existingTag) existingTag.outerHTML = info;
      else loadedDiv.innerHTML += info;

      document.getElementById('upload-status').textContent = `${summary.source} loaded successfully.`;
    }

    // ================================================================
    //  HEAT MAP (Delinquency by State)
    // ================================================================
    function updateHeatMap() {
      if (!statesLayer || heatMapMode === 'off') return;
      Object.entries(stateFeatures).forEach(([fips, layer]) => {
        applyHeatMapStyle(fips, layer);
      });
    }

    function applyHeatMapStyle(fips, layer) {
      if (heatMapMode === 'off') {
        layer.setStyle(defaultStateStyle);
        return;
      }
      const info = stateData[fips];
      if (!info) return;
      const abbr = info.abbr;

      // FHFA HPA overlay mode
      if (heatMapMode === 'fhfa') {
        const stHPI = FHFA_HPI[abbr];
        if (!stHPI || !stHPI[fhfaYear]) {
          layer.setStyle({ ...defaultStateStyle, fillColor: '#333', fillOpacity: 0.15 });
          return;
        }
        const hpa = stHPI[fhfaYear].hpa;
        const color = getHPAColor(hpa);
        const opacity = 0.25 + Math.min(Math.abs(hpa) / 25, 0.55);
        layer.setStyle({ fillColor: color, fillOpacity: opacity, color: '#556', weight: 1.2, opacity: 0.8 });
        return;
      }

      let sdqRate = null;
      if (heatMapMode === 'freddie' && freddieData) {
        const sa = freddieData.stateAgg[abbr];
        if (sa && sa.count > 0) sdqRate = (sa.dlq.d90plus / sa.count) * 100;
      } else if (heatMapMode === 'fannie' && fannieData) {
        const sa = fannieData.stateAgg[abbr];
        if (sa && sa.count > 0) sdqRate = (sa.dlq.d90plus / sa.count) * 100;
      } else if (heatMapMode === 'combined') {
        const fc = freddieData?.stateAgg[abbr], fn = fannieData?.stateAgg[abbr];
        const total = (fc?.count || 0) + (fn?.count || 0);
        const d90 = (fc?.dlq.d90plus || 0) + (fn?.dlq.d90plus || 0);
        if (total > 0) sdqRate = (d90 / total) * 100;
      } else if (heatMapMode === 'delta') {
        const fc = freddieData?.stateAgg[abbr], fn = fannieData?.stateAgg[abbr];
        const freRate = fc && fc.count > 0 ? (fc.dlq.d90plus / fc.count) * 100 : null;
        const fnmRate = fn && fn.count > 0 ? (fn.dlq.d90plus / fn.count) * 100 : null;
        if (freRate !== null && fnmRate !== null) {
          sdqRate = freRate - fnmRate; // positive = Freddie worse
        }
      }

      if (sdqRate === null) {
        layer.setStyle({ ...defaultStateStyle, fillColor: '#333', fillOpacity: 0.15 });
        return;
      }

      let color, opacity;
      if (heatMapMode === 'delta') {
        // Diverging: blue (Fannie worse) -> white -> red (Freddie worse)
        const abs = Math.min(Math.abs(sdqRate), 5);
        opacity = 0.2 + (abs / 5) * 0.5;
        color = sdqRate > 0 ? '#ef5350' : sdqRate < 0 ? '#42a5f5' : '#888';
      } else {
        color = getDlqColor(sdqRate);
        opacity = 0.25 + Math.min(sdqRate / 8, 0.55);
      }

      layer.setStyle({
        fillColor: color, fillOpacity: opacity,
        color: '#556', weight: 1.2, opacity: 0.8
      });
    }

    function getDlqColor(rate) {
      if (rate < 0.5) return '#4caf50';
      if (rate < 1.0) return '#8bc34a';
      if (rate < 2.0) return '#ffca28';
      if (rate < 3.5) return '#ff9800';
      if (rate < 5.0) return '#f44336';
      return '#b71c1c';
    }

    function getHPAColor(hpa) {
      // Diverging: red (decline) -> yellow (flat) -> green (appreciation)
      if (hpa <= -15) return '#b71c1c';
      if (hpa <= -10) return '#e53935';
      if (hpa <= -5)  return '#ef5350';
      if (hpa <= -2)  return '#ff8a65';
      if (hpa < 2)    return '#ffca28';
      if (hpa < 5)    return '#c6e04c';
      if (hpa < 10)   return '#8bc34a';
      if (hpa < 15)   return '#4caf50';
      if (hpa < 20)   return '#2e7d32';
      return '#1b5e20';
    }

    function setHeatMapMode(mode) {
      heatMapMode = mode;
      if (mode === 'off' && statesLayer) {
        statesLayer.resetStyle();
      }
      updateHeatMap();
    }

    function getStateDlqSummary(abbr) {
      const fc = freddieData?.stateAgg[abbr], fn = fannieData?.stateAgg[abbr];
      const count = (fc?.count || 0) + (fn?.count || 0);
      if (count === 0) return null;
      const d90 = (fc?.dlq.d90plus || 0) + (fn?.dlq.d90plus || 0);
      return { count, sdqRate: (d90 / count) * 100 };
    }

    document.getElementById('dash-tabs').addEventListener('click', function(e) {

      document.querySelectorAll('.dashboard-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById('tab-' + e.target.dataset.tab).classList.add('active');
    });

    document.getElementById('dash-header').addEventListener('click', function(e) {
      if (e.target.classList.contains('dashboard-tab')) return;
      const dash = document.getElementById('dashboard');
      const toggle = document.getElementById('dash-toggle');
      if (dash.classList.contains('collapsed')) {
        dash.classList.remove('collapsed');
        dash.classList.add('expanded');
        toggle.innerHTML = '&#9660;';
      } else {
        dash.classList.remove('expanded');
        dash.classList.add('collapsed');
        toggle.innerHTML = '&#9650;';
      }
    });

      if (dash.classList.contains('collapsed')) {
        dash.classList.remove('collapsed');
        dash.classList.add('expanded');
        document.getElementById('dash-toggle').innerHTML = '&#9660;';

    // --- Delinquency Tab ---
    function renderDelinquencyTab() {
      const el = document.getElementById('dlq-content');
      if (!freddieData && !fannieData) {
        el.innerHTML = '<div style="color:#778;">Upload loan tapes to see delinquency comparison.</div>';
        return;
      }

      let html = '<table class="dlq-table"><thead><tr>';
      html += '<th>Source</th><th>Loans</th><th>Current</th><th>30 Day</th><th>60 Day</th><th>90+ Day</th><th>SDQ Rate</th><th>60+ Rate</th>';
      html += '</tr></thead><tbody>';

      function dlqRow(label, d, total, cls) {
        const sdq = total > 0 ? (d.d90plus / total * 100) : 0;
        const d60plus = total > 0 ? ((d.d60 + d.d90plus) / total * 100) : 0;
        return `<tr>
          <td><b>${label}</b></td>
          <td>${total.toLocaleString()}</td>
          <td>${total > 0 ? (d.current / total * 100).toFixed(2) + '%' : '-'}</td>
          <td>${total > 0 ? (d.d30 / total * 100).toFixed(2) + '%' : '-'}</td>
          <td>${total > 0 ? (d.d60 / total * 100).toFixed(2) + '%' : '-'}</td>
          <td>${total > 0 ? (d.d90plus / total * 100).toFixed(2) + '%' : '-'}</td>
          <td style="color:${sdq > 3 ? '#ef5350' : sdq > 1 ? '#ffca28' : '#4caf50'};font-weight:600">${sdq.toFixed(2)}%</td>
          <td style="color:${d60plus > 4 ? '#ef5350' : d60plus > 2 ? '#ffca28' : '#4caf50'}">${d60plus.toFixed(2)}%</td>
        </tr>`;
      }

      if (freddieData) {
        html += dlqRow('<span class="file-tag freddie">FRE</span> Freddie', freddieData.summary.dlqCounts, freddieData.summary.totalLoans);
      }
      if (fannieData) {
        html += dlqRow('<span class="file-tag fannie">FNM</span> Fannie', fannieData.summary.dlqCounts, fannieData.summary.totalLoans);
      }

      if (freddieData && fannieData) {
        const fd = freddieData.summary.dlqCounts, nd = fannieData.summary.dlqCounts;
        const ft = freddieData.summary.totalLoans, nt = fannieData.summary.totalLoans;
        const combD = {
          current: fd.current + nd.current, d30: fd.d30 + nd.d30,
          d60: fd.d60 + nd.d60, d90plus: fd.d90plus + nd.d90plus
        };
        html += dlqRow('<b style="color:#ab47bc">Combined</b>', combD, ft + nt);

        // Delta row
        const freSDQ = ft > 0 ? (fd.d90plus / ft * 100) : 0;
        const fnmSDQ = nt > 0 ? (nd.d90plus / nt * 100) : 0;
        const delta = freSDQ - fnmSDQ;
        const fre30 = ft > 0 ? (fd.d30 / ft * 100) : 0;
        const fnm30 = nt > 0 ? (nd.d30 / nt * 100) : 0;
        const fre60 = ft > 0 ? (fd.d60 / ft * 100) : 0;
        const fnm60 = nt > 0 ? (nd.d60 / nt * 100) : 0;

        function fmtDelta(v) {
          const cls = v > 0 ? 'dlq-negative' : v < 0 ? 'dlq-positive' : 'dlq-neutral';
          return `<span class="${cls}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
        }

        html += `<tr style="border-top:2px solid #0f3460">
          <td><b style="color:#778">Delta (FRE-FNM)</b></td>
          <td></td>
          <td>${fmtDelta((ft > 0 ? fd.current/ft*100 : 0) - (nt > 0 ? nd.current/nt*100 : 0))}</td>
          <td>${fmtDelta(fre30 - fnm30)}</td>
          <td>${fmtDelta(fre60 - fnm60)}</td>
          <td>${fmtDelta(freSDQ - fnmSDQ)}</td>
          <td>${fmtDelta(delta)}</td>
          <td></td>
        </tr>`;
      }

      html += '</tbody></table>';

      // Heat map controls
      const hasData = freddieData || fannieData;
      const hasBoth = freddieData && fannieData;
      html += `<div class="heatmap-controls">
        <b style="color:#e94560;font-size:0.78rem;">DLQ Heat Map:</b>
        <label><input type="radio" name="heatmap" value="off" ${heatMapMode==='off'?'checked':''}> Off</label>
        ${freddieData ? `<label><input type="radio" name="heatmap" value="freddie" ${heatMapMode==='freddie'?'checked':''}> Freddie</label>` : ''}
        ${fannieData ? `<label><input type="radio" name="heatmap" value="fannie" ${heatMapMode==='fannie'?'checked':''}> Fannie</label>` : ''}
        ${hasBoth ? `<label><input type="radio" name="heatmap" value="combined" ${heatMapMode==='combined'?'checked':''}> Combined</label>` : ''}
        ${hasBoth ? `<label><input type="radio" name="heatmap" value="delta" ${heatMapMode==='delta'?'checked':''}> Delta (FRE-FNM)</label>` : ''}
        <div class="heatmap-legend">
          <span style="font-size:0.65rem">Low</span>
          <div class="swatch" style="background:#4caf50"></div>
          <div class="swatch" style="background:#8bc34a"></div>
          <div class="swatch" style="background:#ffca28"></div>
          <div class="swatch" style="background:#ff9800"></div>
          <div class="swatch" style="background:#f44336"></div>
          <div class="swatch" style="background:#b71c1c"></div>
          <span style="font-size:0.65rem">High</span>
        </div>
      </div>`;

      // State-level delinquency table (top 10 by SDQ)
      const allStates = getAllStatesDlq();
      if (allStates.length > 0) {
        allStates.sort((a, b) => b.sdqRate - a.sdqRate);
        html += '<div style="margin-top:12px;"><b style="color:#e94560;font-size:0.78rem;">Top States by SDQ Rate (90+ day):</b></div>';
        html += '<table class="dlq-table" style="margin-top:4px;"><thead><tr>';
        html += '<th>State</th><th>Loans</th>';
        if (freddieData) html += '<th>FRE SDQ</th>';
        if (fannieData) html += '<th>FNM SDQ</th>';
        if (hasBoth) html += '<th>Delta</th>';
        html += '<th>Combined SDQ</th>';
        html += '</tr></thead><tbody>';

        allStates.slice(0, 15).forEach(s => {
          html += `<tr>
            <td><b>${s.abbr}</b></td>
            <td>${s.totalCount.toLocaleString()}</td>`;
          if (freddieData) html += `<td>${s.freSDQ !== null ? s.freSDQ.toFixed(2) + '%' : '-'}</td>`;
          if (fannieData) html += `<td>${s.fnmSDQ !== null ? s.fnmSDQ.toFixed(2) + '%' : '-'}</td>`;
          if (hasBoth) {
            const d = (s.freSDQ || 0) - (s.fnmSDQ || 0);
            const cls = d > 0 ? 'dlq-negative' : d < 0 ? 'dlq-positive' : 'dlq-neutral';
            html += `<td class="${cls}">${d > 0 ? '+' : ''}${d.toFixed(2)}%</td>`;
          }
          html += `<td style="color:${s.sdqRate > 3 ? '#ef5350' : s.sdqRate > 1 ? '#ffca28' : '#4caf50'};font-weight:600">${s.sdqRate.toFixed(2)}%</td>`;
          html += '</tr>';
        });
        html += '</tbody></table>';
      }

      el.innerHTML = html;

      // Attach heat map radio listeners
      el.querySelectorAll('input[name="heatmap"]').forEach(radio => {
        radio.addEventListener('change', function() { setHeatMapMode(this.value); });
      });
    }

    function getAllStatesDlq() {
      const states = {};
      if (freddieData) {
        Object.entries(freddieData.stateAgg).forEach(([abbr, sa]) => {
          if (!states[abbr]) states[abbr] = { abbr, freCount: 0, fnmCount: 0, freD90: 0, fnmD90: 0 };
          states[abbr].freCount = sa.count;
          states[abbr].freD90 = sa.dlq.d90plus;
        });
      }
      if (fannieData) {
        Object.entries(fannieData.stateAgg).forEach(([abbr, sa]) => {
          if (!states[abbr]) states[abbr] = { abbr, freCount: 0, fnmCount: 0, freD90: 0, fnmD90: 0 };
          states[abbr].fnmCount = sa.count;
          states[abbr].fnmD90 = sa.dlq.d90plus;
        });
      }
      return Object.values(states).map(s => {
        s.totalCount = s.freCount + s.fnmCount;
        const totalD90 = s.freD90 + s.fnmD90;
        s.sdqRate = s.totalCount > 0 ? (totalD90 / s.totalCount * 100) : 0;
        s.freSDQ = s.freCount > 0 ? (s.freD90 / s.freCount * 100) : null;
        s.fnmSDQ = s.fnmCount > 0 ? (s.fnmD90 / s.fnmCount * 100) : null;
        return s;
      }).filter(s => s.totalCount > 0);
    }

    // --- HPA Tab (FHFA Data) ---
    function renderHPATab() {
      const el = document.getElementById('hpa-content');

      // Build state list from FHFA data
      const sortedStates = Object.keys(FHFA_HPI).sort();

        el.innerHTML = '<div style="color:#778;">FHFA HPI data not loaded.</div>';

        html += `<option value="${s}">${s}</option>`;
      });
      html += '</select>';
      html += '<span style="color:#667;font-size:0.72rem;margin-left:8px;">Source: FHFA Purchase-Only HPI (Seasonally Adjusted)</span>';
      html += '</div>';
      html += '<div id="hpa-chart-container"></div>';

      el.innerHTML = html;

      document.getElementById('hpa-state-select').addEventListener('change', renderHPA);
      renderHPA();

    function renderHPA() {
      const container = document.getElementById('hpa-chart-container');
      if (!container) return;

      const stateAbbr = document.getElementById('hpa-state-select')?.value;
      if (!stateAbbr || !FHFA_HPI[stateAbbr]) return;

      const stData = FHFA_HPI[stateAbbr];
      const years = Object.keys(stData).map(Number).filter(y => y >= 1992).sort((a, b) => a - b);

      if (years.length === 0) {
        container.innerHTML = '<div style="color:#778;">No FHFA data for this state.</div>';
        return;
      }

      // Find max absolute HPA for scaling
      let maxAbs = 1;
      years.forEach(yr => { maxAbs = Math.max(maxAbs, Math.abs(stData[yr].hpa)); });

      let html = '<div class="hpa-chart-area"><div class="hpa-bars">';
      html += '<div style="display:flex;justify-content:space-between;margin-bottom:6px;padding-left:36px;font-size:0.65rem;color:#556;">';
      html += `<span>-${maxAbs.toFixed(0)}%</span><span>0%</span><span>+${maxAbs.toFixed(0)}%</span></div>`;

      years.forEach(yr => {
        const hpa = stData[yr].hpa;
        const barWidth = Math.min(Math.abs(hpa) / maxAbs * 50, 50);
        const isPos = hpa >= 0;

        html += `<div class="hpa-row">
          <span class="hpa-year">${yr}</span>
          <div class="hpa-bar-track">
            <div class="hpa-bar-center"></div>
            <div class="hpa-bar ${isPos ? 'positive' : 'negative'}" style="width:${barWidth}%;${isPos ? 'left:50%' : 'right:50%'}"></div>
          </div>
          <span class="hpa-value" style="color:${isPos ? '#4caf50' : '#ef5350'}">${hpa > 0 ? '+' : ''}${hpa.toFixed(1)}%</span>
        </div>`;
      });

      html += '</div>';

      // Summary stats
      const allVals = years.map(yr => stData[yr].hpa);
      const avgHPA = allVals.reduce((a, b) => a + b, 0) / allVals.length;
      const maxHPA = Math.max(...allVals);
      const minHPA = Math.min(...allVals);
      const latestHPA = allVals[allVals.length - 1] || 0;
      const latestIdx = stData[years[years.length - 1]].idx;

      html += `<div class="hpa-summary">
        <div style="color:#e94560;font-weight:600;margin-bottom:6px;">FHFA HPI — ${stateAbbr}</div>
        <div class="stat-row"><span>Period</span><span class="val">${years[0]}–${years[years.length-1]}</span></div>
        <div class="stat-row"><span>Current Index</span><span class="val">${latestIdx.toFixed(1)}</span></div>
        <div class="stat-row"><span>Latest YoY</span><span class="val" style="color:${latestHPA>=0?'#4caf50':'#ef5350'}">${latestHPA>0?'+':''}${latestHPA.toFixed(1)}%</span></div>
        <div class="stat-row"><span>Avg Annual HPA</span><span class="val">${avgHPA>0?'+':''}${avgHPA.toFixed(1)}%</span></div>
        <div class="stat-row"><span>Best Year</span><span class="val" style="color:#4caf50">+${maxHPA.toFixed(1)}%</span></div>
        <div class="stat-row"><span>Worst Year</span><span class="val" style="color:${minHPA<0?'#ef5350':'#4caf50'}">${minHPA>0?'+':''}${minHPA.toFixed(1)}%</span></div>
        <div class="stat-row"><span>Cumulative (since 1991)</span><span class="val">${latestIdx > 0 ? '+' : ''}${(latestIdx - 100).toFixed(1)}%</span></div>
      </div>`;

      html += '</div>';
      html += '<div class="hpa-note">FHFA Purchase-Only House Price Index, seasonally adjusted. YoY change computed from Q4 index values. Base: 1991 Q1 = 100.</div>';

      container.innerHTML = html;
    }

    // ================================================================
    //  CLEAR DATA
    // ================================================================
    function clearAllData() {
      freddieData = null;
      fannieData = null;
      freddieLoanLayer.clearLayers();
      fannieLoanLayer.clearLayers();
      freddieZipLayer.clearLayers();
      fannieZipLayer.clearLayers();
      heatMapMode = 'off';
      if (statesLayer) statesLayer.resetStyle();
      document.getElementById('upload-status').innerHTML =
        'Upload CRT/CAS pipe-delimited or CSV tapes.<br>Computes ERCF capital + delinquency analysis.';
      document.getElementById('loaded-files').innerHTML = '';
      document.getElementById('clear-btn').style.display = 'none';
      document.getElementById('file-freddie').value = '';
      document.getElementById('file-fannie').value = '';
      document.getElementById('dash-title').textContent = 'Analysis Dashboard';
      renderOverviewTab();
      renderDelinquencyTab();
      renderHPATab();
    }

    // ================================================================
    //  UTILITIES
    // ================================================================
    function avg(arr) {
      return arr.length ? (arr.reduce((a, b) => a + b, 0) / arr.length) : 0;
    }
    function fmtM(val) { return val >= 1e9 ? `$${(val/1e9).toFixed(2)}B` : `$${(val/1e6).toFixed(1)}M`; }
    function fmtK(val) { return val >= 1e6 ? `$${(val/1e6).toFixed(2)}M` : `$${(val/1e3).toFixed(0)}K`; }

    function getRWColor(rw) {
      if (rw < 0.25) return '#4caf50';
      if (rw < 0.40) return '#8bc34a';
      if (rw < 0.55) return '#ffca28';
      if (rw < 0.75) return '#ff9800';
      return '#e94560';
    }

    // ================================================================
    //  EVENT HANDLERS
    // ================================================================
    map.on('click', () => {
      document.getElementById('info-panel').style.display = 'none';
      document.getElementById('dash-title').textContent = 'Analysis Dashboard';
    });

    darkBase.on('tileload', function onFirst() {
      document.getElementById('loading').style.display = 'none';
      darkBase.off('tileload', onFirst);
    });
    darkBase.on('tileerror', function onErr() {
      document.getElementById('loading').style.display = 'none';
      darkBase.off('tileerror', onErr);
    });
    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 2000);

    // Initialize FHFA HPA tab on load
    renderHPATab();
  </script>
</body>
</html>
